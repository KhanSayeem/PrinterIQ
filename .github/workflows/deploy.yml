name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 170.64.143.200
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/printeriq
            git fetch origin main
            git reset --hard origin/main
            set -a
            [ -f .env ] && . ./.env
            set +a
            python3 -m venv .venv || (apt-get update && apt-get install -y python3-venv && python3 -m venv .venv)
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e services/pipeline
            npm --prefix services/reply-agent ci --include=dev
            npm --prefix services/reply-agent run build
            corepack enable
            corepack prepare pnpm@10.18.3 --activate
            pnpm --dir services/dashboard install --frozen-lockfile
            pnpm --dir services/dashboard run build
            python -m playwright install --with-deps chromium
            # Apply any new migrations against Supabase. No error swallowing:
            # this line used to end in `2>/dev/null || true` and there was no
            # migrate script at all, so it failed on every deploy in silence
            # and migration 0015 shipped green without reaching the database.
            # `set -e` above stops the deploy before the services restart, so
            # nothing starts expecting a schema that is not there.
            # Two env files that disagree about one name means whichever file the
            # process happens to read wins. On 2026-09-16 the dashboard's own
            # .env.production held a second Instantly API key for a workspace with
            # no paid plan, and pm2 hid it by starting every app from the root .env.
            node scripts/check-env-drift.mjs
            npm --prefix database run migrate
            pm2 delete all || true
            pm2 start ecosystem.config.js --update-env
            pm2 save
