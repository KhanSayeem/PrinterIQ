server {
    server_name preview.presciaiq.com;

    root /var/www/previews;
    autoindex off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://dashboard.presciaiq.com" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /p/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/preview.presciaiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.presciaiq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name preview.presciaiq.com;

    return 301 https://preview.presciaiq.com$request_uri;
}
