server {
    server_name preview.presciaiq.com;

    root /var/www/previews;
    autoindex off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://dashboard.presciaiq.com" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # A hit on a preview page is the only per-lead evidence that an email was
    # delivered and read: open and click tracking are both off for
    # deliverability, and Postmaster Tools needs more volume than the ramp
    # sends. The slug is high entropy and appears in exactly one email, so a
    # load here is that prospect clicking through, not an anonymous open.
    #
    # `mirror` duplicates the request into an internal location and discards
    # whatever comes back. try_files below is untouched, the prospect's page
    # is served by the original request, and a reply-agent that is down,
    # slow or misconfigured cannot delay or break the page. That is
    # deliberate: no tracking is worth costing us a prospect seeing their
    # site.
    location /p/ {
        mirror              /_preview_view;
        mirror_request_body off;

        # $uri/index.html, not $uri/. Each slug on disk is a directory
        # holding index.html, so $uri/ matches the directory and nginx issues
        # an internal redirect to add the index. That redirect re-enters this
        # location and fires `mirror` a second time, so one prospect opening
        # their page recorded two views. Measured against production: the
        # trailing-slash URL that goes in the email counted 2, the direct
        # /index.html path counted 1. Naming the index file keeps try_files on
        # a plain file match, which is served without re-entering the
        # location, so one view is one view.
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /_preview_view {
        internal;

        proxy_pass              http://127.0.0.1:3001/internal/preview-view;
        proxy_method            POST;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";

        # The original request, restated explicitly. proxy_method has already
        # replaced the method, and being explicit means the reply-agent's
        # contract does not silently change if this block is edited.
        proxy_set_header X-Preview-Path   $request_uri;
        proxy_set_header X-Preview-Method $request_method;
        proxy_set_header User-Agent       $http_user_agent;

        # webhooks.presciaiq.com proxies every path to port 3001, so this
        # endpoint is publicly reachable. The secret is what stops a stranger
        # forging views. It is deliberately not in this file: create
        # /etc/nginx/snippets/preview-view-secret.conf containing
        #
        #   proxy_set_header X-Preview-View-Secret "<PREVIEW_VIEW_SECRET>";
        #
        # matching PREVIEW_VIEW_SECRET in the root .env, then reload nginx.
        #
        # The wildcard is load-bearing. nginx tolerates a wildcard include
        # that matches nothing, so a missing snippet leaves view tracking off
        # and previews serving normally. A plain include would refuse to
        # start nginx and take every preview page down with it.
        include /etc/nginx/snippets/preview-view-secret*.conf;

        # Bounds the mirror. Even a wedged reply-agent releases the
        # subrequest inside a second.
        proxy_connect_timeout 1s;
        proxy_send_timeout    1s;
        proxy_read_timeout    1s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/preview.presciaiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.presciaiq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name preview.presciaiq.com;

    return 301 https://preview.presciaiq.com$request_uri;
}
