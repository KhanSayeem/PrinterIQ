# PrinterIQ Nginx config
# Routing per PRD Section 3.
#
# SSL: run `certbot --nginx -d dashboard.printeriq.com -d webhooks.printeriq.com`
# after DNS is pointed at 170.64.143.200 to obtain Let's Encrypt certs.
# Certbot will modify this file automatically.

server {
    listen 80;
    server_name dashboard.printeriq.com;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name webhooks.printeriq.com;

    # /instantly  → reply agent
    # /sms        → reply agent
    # /stripe     → reply agent
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Stripe requires raw body for signature verification
        proxy_request_buffering off;
    }
}
