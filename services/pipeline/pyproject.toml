[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "printeriq-pipeline"
version = "0.1.0"
description = "PrinterIQ Python pipeline workers"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "playwright>=1.45.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["clients.playwright_audit"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "jsonschema.*"]
ignore_missing_imports = true
